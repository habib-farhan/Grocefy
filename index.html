<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grocefy</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <!-- Config File -->
  <script src="config.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-cart-shopping text-xl"></i>
      <h1 class="text-xl font-bold tracking-tight">Grocefy</h1>
    </div>
    <div id="connectionStatus" class="flex items-center space-x-1 text-xs bg-indigo-700 px-2.5 py-1 rounded-full">
      <span class="w-2 h-2 rounded-full bg-yellow-400 inline-block animate-pulse"></span>
      <span>Connecting...</span>
    </div>
  </header>

  <!-- Main View -->
  <main class="max-w-md w-full mx-auto p-4 space-y-6 flex-1">

    <!-- Create List Section -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
      <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
        <i class="fa-solid fa-square-plus text-indigo-600"></i> Create List
      </h2>
      <div class="flex gap-2">
        <input type="text" id="listTitleInput" placeholder="List Name (e.g. Weekly Market)..."
          class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        <button onclick="createNewList()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-semibold text-sm transition">
          Create
        </button>
      </div>
    </section>

    <!-- My Lists Section -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-base font-bold text-gray-700 uppercase tracking-wider text-xs">My Lists</h2>
        <span id="activeListsCount" class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold">0</span>
      </div>

      <!-- Add Item to Active List Form -->
      <form id="addItemForm" onsubmit="handleItemSubmit(event)" class="bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex gap-2">
        <input type="text" id="itemNameInput" placeholder="Type item name (e.g. Milk, Rice)..." required
          class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-semibold text-sm transition flex items-center gap-1">
          <i class="fa-solid fa-plus text-xs"></i> Add
        </button>
      </form>

      <!-- Active Lists Container -->
      <div id="listsContainer" class="space-y-4">
        <!-- Lists render dynamically here -->
      </div>
    </section>

  </main>

  <!-- Quantity & Unit Picker Modal -->
  <div id="qtyModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-xl space-y-4 animate-in fade-in zoom-in duration-150">
      <div class="text-center">
        <span id="modalCategoryIcon" class="text-3xl block mb-1">🛒</span>
        <h3 id="modalItemTitle" class="font-bold text-lg text-gray-800 capitalize">Item Name</h3>
        <p class="text-xs text-gray-400">Specify quantity and unit</p>
      </div>

      <!-- Quantity Adjuster -->
      <div class="flex items-center justify-center gap-3 my-2">
        <button type="button" onclick="adjustQty(-1)" class="w-10 h-10 rounded-full bg-gray-100 text-gray-700 font-bold text-lg hover:bg-gray-200 transition flex items-center justify-center">-</button>
        <input type="number" id="modalQtyVal" value="1" min="0.1" step="any"
          class="w-20 text-center text-xl font-bold border border-gray-300 rounded-lg py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="button" onclick="adjustQty(1)" class="w-10 h-10 rounded-full bg-gray-100 text-gray-700 font-bold text-lg hover:bg-gray-200 transition flex items-center justify-center">+</button>
      </div>

      <!-- Unit Selector -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 text-center">Unit</label>
        <select id="modalUnitSelect" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="pcs">Pcs (Pieces)</option>
          <option value="kg">kg (Kilograms)</option>
          <option value="g">g (Grams)</option>
          <option value="Litre">Litre</option>
          <option value="ml">ml (Millilitres)</option>
          <option value="pack">Pack</option>
          <option value="box">Box</option>
        </select>
      </div>

      <!-- Modal Action Buttons -->
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="closeQtyModal()" class="flex-1 py-2 rounded-lg border border-gray-300 text-gray-600 font-semibold text-sm hover:bg-gray-50 transition">Cancel</button>
        <button type="button" onclick="confirmAddItem()" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white font-semibold text-sm hover:bg-indigo-700 transition">Add to List</button>
      </div>
    </div>
  </div>

  <script>
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allLists = {};
    let pendingItem = { name: '', category: 'Other', icon: '🛒' };

    // Keywords for background auto-categorization
    const categoryKeywords = {
      Produce: ['apple', 'banana', 'orange', 'lemon', 'tomato', 'potato', 'onion', 'garlic', 'carrot', 'spinach', 'cucumber', 'berry', 'fruit', 'vegetable', 'avocado'],
      Dairy: ['milk', 'cheese', 'butter', 'yogurt', 'curd', 'cream', 'egg', 'paneer'],
      Bakery: ['bread', 'bun', 'bagel', 'croissant', 'cake', 'tortilla', 'toast'],
      Meat: ['chicken', 'beef', 'pork', 'fish', 'salmon', 'shrimp', 'meat', 'sausage'],
      Beverages: ['water', 'juice', 'soda', 'coke', 'coffee', 'tea', 'beer', 'wine'],
      Frozen: ['ice cream', 'frozen', 'pizza', 'fries'],
      Pantry: ['rice', 'flour', 'pasta', 'sugar', 'salt', 'oil', 'sauce', 'snack', 'chip', 'chocolate', 'biscuit', 'cereal', 'lentils', 'beans'],
      Household: ['soap', 'shampoo', 'paper', 'tissue', 'detergent', 'cleaner', 'toothbrush']
    };

    const categoryIcons = {
      Produce: '🥦', Dairy: '🥛', Bakery: '🍞', Meat: '🥩',
      Beverages: '🧃', Frozen: '🧊', Pantry: '🥫', Household: '🧼', Other: '🛒'
    };

    // Connection Status Listener
    db.ref('.info/connected').on('value', (snap) => {
      const statusEl = document.getElementById('connectionStatus');
      statusEl.innerHTML = snap.val() === true 
        ? `<span class="w-2 h-2 rounded-full bg-green-400 inline-block"></span><span>Live</span>`
        : `<span class="w-2 h-2 rounded-full bg-yellow-400 inline-block animate-pulse"></span><span>Connecting...</span>`;
    });

    // Realtime Lists Listener
    db.ref('lists').on('value', (snapshot) => {
      allLists = snapshot.val() || {};
      renderLists();
    });

    // Create a New List (Defaults to New List 1, New List 2, etc.)
    function createNewList() {
      const titleInput = document.getElementById('listTitleInput');
      let title = titleInput.value.trim();

      if (!title) {
        const count = Object.keys(allLists).length + 1;
        title = `New List ${count}`;
      }

      const newListRef = db.ref('lists').push();
      newListRef.set({
        title: title,
        createdAt: Date.now(),
        items: {}
      });

      titleInput.value = '';
    }

    // Handle initial item typing submit -> Opens Modal
    function handleItemSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('itemNameInput');
      const val = input.value.trim();
      if (!val) return;

      let detectedCat = 'Other';
      const lower = val.toLowerCase();

      for (const [cat, keywords] of Object.entries(categoryKeywords)) {
        if (keywords.some(k => lower.includes(k))) {
          detectedCat = cat;
          break;
        }
      }

      pendingItem = {
        name: val,
        category: detectedCat,
        icon: categoryIcons[detectedCat] || '🛒'
      };

      document.getElementById('modalItemTitle').textContent = val;
      document.getElementById('modalCategoryIcon').textContent = pendingItem.icon;
      document.getElementById('modalQtyVal').value = 1;
      document.getElementById('modalUnitSelect').value = 'pcs';
      document.getElementById('qtyModal').classList.remove('hidden');
    }

    function adjustQty(delta) {
      const input = document.getElementById('modalQtyVal');
      let current = parseFloat(input.value) || 1;
      current = Math.max(0.1, current + delta);
      input.value = current;
    }

    function closeQtyModal() {
      document.getElementById('qtyModal').classList.add('hidden');
    }

    // Confirm Modal -> Adds item to active list
    function confirmAddItem() {
      const listKeys = Object.keys(allLists);
      
      // If no list exists yet, create default list automatically
      if (listKeys.length === 0) {
        const newListRef = db.ref('lists').push();
        const listId = newListRef.key;
        newListRef.set({
          title: "New List 1",
          createdAt: Date.now()
        });
        saveItemToList(listId);
      } else {
        // Add to the most recently created list
        const latestListId = listKeys[listKeys.length - 1];
        saveItemToList(latestListId);
      }

      closeQtyModal();
      document.getElementById('itemNameInput').value = '';
    }

    function saveItemToList(listId) {
      const qty = parseFloat(document.getElementById('modalQtyVal').value) || 1;
      const unit = document.getElementById('modalUnitSelect').value;
      const itemKey = pendingItem.name.toLowerCase().replace(/[.#$/\[\]]/g, "_");

      db.ref(`lists/${listId}/items/${itemKey}`).set({
        name: pendingItem.name,
        qty: qty,
        unit: unit,
        category: pendingItem.category,
        icon: pendingItem.icon,
        checked: false,
        createdAt: Date.now()
      });

      // Save to history automatically
      db.ref(`history/${itemKey}`).set({
        name: pendingItem.name,
        category: pendingItem.category,
        unit: unit,
        lastUsed: Date.now()
      });
    }

    // Render Lists
    function renderLists() {
      const container = document.getElementById('listsContainer');
      const listKeys = Object.keys(allLists);
      document.getElementById('activeListsCount').textContent = listKeys.length;

      if (listKeys.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 bg-white rounded-xl border border-dashed border-gray-300">
            <span class="text-3xl">📝</span>
            <p class="text-gray-500 font-medium mt-2 text-sm">No shopping lists yet.</p>
            <p class="text-xs text-gray-400">Type an item name above or create a list title to begin.</p>
          </div>`;
        return;
      }

      let html = '';
      listKeys.forEach(listId => {
        const list = allLists[listId];
        const items = list.items || {};
        const itemKeys = Object.keys(items);

        html += `
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <!-- List Header -->
            <div class="bg-gray-50 px-4 py-2.5 border-b border-gray-200 flex justify-between items-center">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-list-ul text-indigo-600 text-xs"></i>
                <h3 class="font-bold text-gray-800 text-sm">${list.title}</h3>
                <span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full font-semibold">${itemKeys.length}</span>
              </div>
              <button onclick="deleteList('${listId}')" class="text-gray-400 hover:text-red-500 text-xs transition p-1">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>

            <!-- List Items -->
            <div class="divide-y divide-gray-100">
        `;

        if (itemKeys.length === 0) {
          html += `<div class="p-3 text-center text-xs text-gray-400">No items added to this list yet.</div>`;
        } else {
          itemKeys.forEach(itemKey => {
            const item = items[itemKey];
            const isChecked = item.checked ? 'checked' : '';
            const lineThrough = item.checked ? 'line-through text-gray-400' : 'text-gray-800 font-medium';

            html += `
              <div class="p-3 flex items-center justify-between hover:bg-gray-50 transition">
                <label class="flex items-center gap-3 flex-1 cursor-pointer">
                  <input type="checkbox" ${isChecked} onchange="toggleItemCheck('${listId}', '${itemKey}', ${!item.checked})"
                    class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500">
                  <span class="text-base">${item.icon || '🛒'}</span>
                  <span class="${lineThrough} text-sm">${item.name}</span>
                  <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-md">
                    ${item.qty} ${item.unit}
                  </span>
                </label>
                <button onclick="deleteItem('${listId}', '${itemKey}')" class="text-gray-300 hover:text-red-500 p-1 transition">
                  <i class="fa-solid fa-xmark text-base"></i>
                </button>
              </div>
            `;
          });
        }

        html += `</div></div>`;
      });

      container.innerHTML = html;
    }

    function toggleItemCheck(listId, itemKey, newChecked) {
      db.ref(`lists/${listId}/items/${itemKey}/checked`).set(newChecked);
    }

    function deleteItem(listId, itemKey) {
      db.ref(`lists/${listId}/items/${itemKey}`).remove();
    }

    function deleteList(listId) {
      if (confirm('Are you sure you want to delete this list?')) {
        db.ref(`lists/${listId}`).remove();
      }
    }
  </script>
</body>
</html>
